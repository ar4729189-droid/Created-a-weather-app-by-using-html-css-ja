<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Sky Weather</title>

   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
   <link rel="stylesheet" href="index.css">
</head>

<body id="show">
   <nav class="navbar navbar-dark bg-dark-custom">
      <div class="container d-flex justify-content-between align-items-center">

         <span class="navbar-brand m-0">
            <i class="fa-solid fa-cloud-sun text-warning me-2 animate-sun"></i>
            <span class="brand-text">SkyPulse</span>
         </span>

         <div class="nav-controls d-flex align-items-center gap-3">
            <div class="language-changer">
               <select id="langSelect" class="form-select clean-select">
                  <option value="en">English</option>
                  <option value="ur">اردو (Urdu)</option>
               </select>
            </div>

            <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeBtn">
               <i id="themeIcon" class="fa-solid fa-sun text-warning"></i>
               <span id="themeText" class="d-none d-sm-inline">Light Mode</span>
            </button>
         </div>

      </div>
   </nav>

   <div class="main-container">
      <div class="app-wrapper">
         <main class="weather-container">

            <div class="search-section d-flex align-items-center position-relative">
               <div class="input-wrapper d-flex align-items-center flex-grow-1 position-relative">
                  <input type="text" id="Input" placeholder="Search city...">

               </div>
               <button id="searchbtn">Search</button>
            </div>
            <div class="rounded-1" style="cursor: pointer; width: 25%;" id="suggestion"></div>

            <div id="skeletonLoader" class="weather-dashboard" style="display: none;">
               <div class="main-w d-flex">
                  <div class="main-display">
                     <div class="skeleton skeleton-temp"></div>
                     <div class="location-box">
                        <div class="skeleton skeleton-title"></div>
                        <div class="skeleton skeleton-text"></div>
                     </div>
                     <div class="skeleton skeleton-icon"></div>
                  </div>

                  <div class="details-grid">
                     <div class="detail-box">
                        <div class="skeleton skeleton-sub"></div>
                     </div>
                     <div class="detail-box">
                        <div class="skeleton skeleton-sub"></div>
                     </div>
                     <div class="detail-box">
                        <div class="skeleton skeleton-sub"></div>
                     </div>
                     <div class="detail-box">
                        <div class="skeleton skeleton-sub"></div>
                     </div>
                     <div class="detail-box">
                        <div class="skeleton skeleton-sub"></div>
                     </div>
                     <div class="detail-box">
                        <div class="skeleton skeleton-sub"></div>
                     </div>
                  </div>
               </div>
            </div>

            <div class="weather-dashboard" id="weatherInfo">
               <div class="main-w d-flex">
                  <div class="main-display">
                     <div class="temp-box">
                        <span class="temp" id="temperature">24°C</span>
                     </div>

                     <div class="location-box">
                        <h1 class="city" id="cityName"></h1>
                        <p id="condition"></p>
                     </div>

                     <img id="weatherIcon" src="https://cdn-icons-png.flaticon.com/512/869/869869.png"
                        class="main-sun-icon">
                  </div>

                  <div class="details-grid">
                     <div class="detail-box">
                        <i class="fa-solid fa-droplet text-primary fs-4"></i>
                        <div>
                           <strong id="lblHumidity">Humidity</strong>
                           <p id="humidity">64%</p>
                        </div>
                     </div>

                     <div class="detail-box">
                        <i class="fa-solid fa-wind text-success fs-4"></i>
                        <div>
                           <strong id="lblWind">Wind</strong>
                           <p id="wind">12 km/h</p>
                        </div>
                     </div>

                     <div class="detail-box">
                        <i class="fa-solid fa-temperature-arrow-down"></i>
                        <div>
                           <strong id="lblTempF">Temperature in F</strong>
                           <p id="Fahrienheit"></p>
                        </div>
                     </div>

                     <div class="detail-box">
                        <i class="fa-solid fa-eye text-info fs-4"></i>
                        <div>
                           <strong id="lblTime">Current time / date</strong>
                           <p id="time"></p>
                        </div>
                     </div>

                     <div class="detail-box">
                        <i class="fa-solid fa-gauge text-warning fs-4"></i>
                        <div>
                           <strong id="lblPressure">Pressure</strong>
                           <p id="pressure"></p>
                        </div>
                     </div>

                     <div class="detail-box">
                        <i class="fa-solid fa-cloud-sun text-secondary fs-4"></i>
                        <div>
                           <strong id="lblCloud">Cloud</strong>
                           <p id="cloud"></p>
                        </div>
                     </div>
                  </div>
               </div>
            </div>

         </main>
      </div>

      <footer class="text-center text-white py-3">
         <p class="mb-0 small">© 2026 SkyPulse Weather</p>
      </footer>
   </div>

   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bundle.min.js"></script>
   <script src="index.js"></script>
</body>

</html>
